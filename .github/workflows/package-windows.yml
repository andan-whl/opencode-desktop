name: package-windows

# Builds the Windows installer with the same one-command pipeline used locally
# (CLI build + prebuild + electron-builder). Tag pushes publish a GitHub Release;
# manual dispatches only upload the installer as a workflow artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Bun does not reliably run electron's postinstall on a fresh CI install, but
      # electron-builder's config reuses node_modules/electron/dist as the electron
      # distribution, so extract it explicitly when the postinstall did not.
      - name: Prepare Electron distribution
        working-directory: packages/desktop
        shell: pwsh
        run: |
          if (-not (Test-Path "node_modules/electron/dist")) {
            node node_modules/electron/install.js
          }

      - name: Build CLI and package installer
        env:
          # actions/checkout leaves a detached HEAD, so the CLI build would derive the channel
          # "detached" and register its background service in service-detached.json while the
          # desktop only polls service.json — the renderer then waits for a server forever.
          # "next" keeps the release (prod) desktop identity and maps back to service.json
          # and opencode.db, matching a local build made on the dev branch.
          OPENCODE_CHANNEL: next
        run: bun run --cwd packages/desktop package:full -- --win --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCodeDesktop-win-x64
          path: packages/desktop/dist/OpenCodeDesktop-win-x64.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/desktop/dist/OpenCodeDesktop-win-x64.exe
